# /etc/nginx/sites-available/api.shantigyanniketan.org
# Proxy public API hostname → Node (pm2) on PORT from .env (3003).
# :8686 is api.checkout.pe — do not use it for SGN CMS.
#
#   sudo cp deploy/api.shantigyanniketan.org.nginx.conf /etc/nginx/sites-available/api.shantigyanniketan.org
#   sudo ln -sf /etc/nginx/sites-available/api.shantigyanniketan.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: use certbot if needed:
#   sudo certbot --nginx -d api.shantigyanniketan.org

server {
    listen 80;
    listen [::]:80;
    server_name api.shantigyanniketan.org;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# After certbot, HTTPS server block should also proxy_pass to http://127.0.0.1:3003
# (not :8686 / checkout.pe) and include client_max_body_size 100M;
